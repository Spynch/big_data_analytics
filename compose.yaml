name: ${COMPOSE_PROJECT_NAME:-warehouse-lab}

x-app: &app
  image: warehouse-lab:latest
  pull_policy: never
  environment: &app-environment
    SOURCE_HOST: postgres-source
    SOURCE_CONNECT_PORT: 5432
    SOURCE_DB: ${SOURCE_DB:-source}
    SOURCE_USER: ${SOURCE_USER:-source_user}
    SOURCE_PASSWORD: ${SOURCE_PASSWORD:-source_password}
    DWH_HOST: postgres-dwh
    DWH_CONNECT_PORT: 5432
    DWH_DB: ${DWH_DB:-warehouse}
    DWH_USER: ${DWH_USER:-warehouse_user}
    DWH_PASSWORD: ${DWH_PASSWORD:-warehouse_password}
    MONGO_HOST: mongo-source
    MONGO_CONNECT_PORT: 27017
    MONGO_DB: ${MONGO_DB:-restaurant_source}
    MONGO_USER: ${MONGO_USER:-mongo_admin}
    MONGO_PASSWORD: ${MONGO_PASSWORD:-mongo_password}
    SOURCE_TIMEZONE: ${SOURCE_TIMEZONE:-Europe/Moscow}
  depends_on: &databases
    postgres-source:
      condition: service_healthy
    postgres-dwh:
      condition: service_healthy
    mongo-source:
      condition: service_healthy

services:
  postgres-source:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${SOURCE_DB:-source}
      POSTGRES_USER: ${SOURCE_USER:-source_user}
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD:-source_password}
    ports:
      - '127.0.0.1:${SOURCE_PORT:-5433}:5432'
    volumes:
      - pg_source_lab:/var/lib/postgresql/data
      - ./sql/init/source-schema.sql:/docker-entrypoint-initdb.d/10-source-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-dwh:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DWH_DB:-warehouse}
      POSTGRES_USER: ${DWH_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${DWH_PASSWORD:-warehouse_password}
    ports:
      - '127.0.0.1:${DWH_PORT:-5434}:5432'
    volumes:
      - pg_dwh_lab:/var/lib/postgresql/data
      - ./sql/init/warehouse-stg.sql:/docker-entrypoint-initdb.d/10-warehouse-stg.sql:ro
      - ./sql/init/warehouse-dds.sql:/docker-entrypoint-initdb.d/20-warehouse-dds.sql:ro
      - ./sql/init/warehouse-functions.sql:/docker-entrypoint-initdb.d/30-warehouse-functions.sql:ro
      - ./sql/cdm/views.sql:/docker-entrypoint-initdb.d/40-cdm-views.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-source:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_password}
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_source_lab:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)']
      interval: 5s
      timeout: 10s
      retries: 30

  airflow:
    <<: *app
    build: .
    command: standalone
    environment:
      <<: *app-environment
      AIRFLOW_SCHEDULE: ${AIRFLOW_SCHEDULE:-@hourly}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/warehouse/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    ports:
      - '127.0.0.1:${AIRFLOW_PORT:-8080}:8080'
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  seed:
    <<: *app
    profiles: [tools]
    command: [python, -m, warehouse.seed]

  refresh:
    <<: *app
    profiles: [tools]
    command: [python, -m, airflow_utils.refresh]

volumes:
  pg_source_lab:
  pg_dwh_lab:
  mongo_source_lab:
