name: ${COMPOSE_PROJECT_NAME:-warehouse}

x-runtime: &runtime
  image: warehouse-runtime:1.0.0
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment: &runtime-env
    PYTHONPATH: /opt/warehouse/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/warehouse/dags
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD}@postgres-meta/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '15'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
  volumes:
    - .:/opt/warehouse:ro
    - airflow_logs:/opt/airflow/logs
  entrypoint: [python, -m, warehouse.cli]
  restart: 'no'

services:
  postgres-source:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${SOURCE_ADMIN}
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD}
      POSTGRES_DB: ${SOURCE_DB}
    volumes: [pg_source:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${SOURCE_PORT:-15432}:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-meta:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${META_ADMIN}
      POSTGRES_PASSWORD: ${META_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [pg_meta:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-source:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes: [mongo_data:/data/db]
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 5s
      timeout: 10s
      retries: 40

  minio:
    image: warehouse-minio:RELEASE.2025-10-15T17-29-55Z
    build: {context: ., dockerfile: docker/minio/Dockerfile}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 30

  meta-init:
    <<: *runtime
    command: [bootstrap-meta]
    depends_on:
      postgres-meta: {condition: service_healthy}
      postgres-source: {condition: service_healthy}
      mongo-source: {condition: service_healthy}

  minio-init:
    image: warehouse-minio:RELEASE.2025-10-15T17-29-55Z
    build: {context: ., dockerfile: docker/minio/Dockerfile}
    env_file: .env
    entrypoint: [/bin/sh, /bootstrap/minio.sh]
    volumes: ['./bootstrap:/bootstrap:ro']
    depends_on:
      minio: {condition: service_healthy}

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    environment: &catalog-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://iceberg_catalog:${CATALOG_DB_PASSWORD}@postgres-meta/iceberg_catalog
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://iceberg_catalog:${CATALOG_DB_PASSWORD}@postgres-meta/iceberg_catalog
      RUST_LOG: warn,lakekeeper=info
    command: [migrate]
    depends_on:
      meta-init: {condition: service_completed_successfully}

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    environment: *catalog-env
    command: [serve]
    ports: ['127.0.0.1:${CATALOG_PORT:-8181}:8181']
    healthcheck:
      test: [CMD, /home/nonroot/lakekeeper, healthcheck]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}

  lakekeeper-init:
    <<: *runtime
    command: [bootstrap-catalog]
    depends_on:
      lakekeeper: {condition: service_healthy}

  trino:
    image: trinodb/trino:476
    env_file: .env
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/lake.properties:/etc/trino/catalog/lake.properties:ro
    ports: ['127.0.0.1:${TRINO_PORT:-8081}:8080']
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 10s
      retries: 60
    depends_on:
      lakekeeper-init: {condition: service_completed_successfully}

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.1.2041
    entrypoint: [/bin/sh, /warehouse-entrypoint.sh]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      S3_READ_USER: ${S3_READ_USER}
      S3_READ_PASSWORD: ${S3_READ_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/warehouse.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/warehouse.xml:ro
      - ./docker/clickhouse/entrypoint.sh:/warehouse-entrypoint.sh:ro
    ports: ['127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123']
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8123/ping]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-migrate:
    <<: *runtime
    command: [migrate, postgres]
    depends_on:
      meta-init: {condition: service_completed_successfully}

  control-migrate:
    <<: *runtime
    command: [migrate, control]
    depends_on:
      meta-init: {condition: service_completed_successfully}

  mongo-migrate:
    build: {context: ., dockerfile: docker/mongo/Dockerfile}
    image: warehouse-mongo-migrations:1.0.0
    env_file: .env
    depends_on:
      meta-init: {condition: service_completed_successfully}

  lake-migrate:
    <<: *runtime
    command: [migrate, lake]
    depends_on:
      control-migrate: {condition: service_completed_successfully}
      trino: {condition: service_healthy}

  cdm-init:
    <<: *runtime
    command: [bootstrap-cdm]
    depends_on:
      minio-init: {condition: service_completed_successfully}

  clickhouse-migrate:
    <<: *runtime
    command: [migrate, clickhouse]
    depends_on:
      clickhouse: {condition: service_healthy}
      cdm-init: {condition: service_completed_successfully}
      control-migrate: {condition: service_completed_successfully}

  seed:
    <<: *runtime
    profiles: [tools]
    command: [seed]
    depends_on:
      postgres-migrate: {condition: service_completed_successfully}
      mongo-migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}

  airflow-init:
    <<: *runtime
    command: [bootstrap-airflow]
    depends_on:
      meta-init: {condition: service_completed_successfully}
      lake-migrate: {condition: service_completed_successfully}
      postgres-migrate: {condition: service_completed_successfully}
      mongo-migrate: {condition: service_completed_successfully}
      clickhouse-migrate: {condition: service_completed_successfully}

  airflow-api-server:
    <<: *runtime
    entrypoint: [/entrypoint]
    command: [api-server]
    ports: ['127.0.0.1:${AIRFLOW_PORT:-8080}:8080']
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/v2/monitor/health]
      interval: 10s
      timeout: 10s
      retries: 40
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *runtime
    entrypoint: [/entrypoint]
    command: [scheduler]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8974/health]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-api-server: {condition: service_healthy}

  airflow-dag-processor:
    <<: *runtime
    entrypoint: [/entrypoint]
    command: [dag-processor]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 20s
      timeout: 15s
      retries: 20
    depends_on:
      airflow-api-server: {condition: service_healthy}

  warehouse-cli:
    <<: *runtime
    profiles: [tools]
    command: [status]

  smoke-test:
    <<: *runtime
    profiles: [tools]
    command: [smoke]

volumes:
  pg_source:
  pg_meta:
  mongo_data:
  minio_data:
  clickhouse_data:
  airflow_logs:
